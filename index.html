<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>Acceso restringido</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#0C447C,#185FA5 55%,#1D9E75);color:#1A1A18}
.box{background:#fff;border-radius:12px;padding:2.5rem 2rem;width:370px;
 box-shadow:0 8px 40px rgba(0,0,0,.25)}
.lg{width:52px;height:52px;border-radius:8px;background:#185FA5;display:flex;
 align-items:center;justify-content:center;color:#fff;font-weight:700;margin:0 auto 1rem}
h1{font-size:19px;font-weight:600;text-align:center}
.sub{font-size:12px;color:#5F5E5A;text-align:center;margin:.3rem 0 1.4rem}
label{font-size:11px;font-weight:600;color:#5F5E5A;text-transform:uppercase;
 letter-spacing:.04em;display:block;margin-bottom:5px}
input{width:100%;padding:10px;border:1px solid #E8E7E3;border-radius:6px;font-size:14px}
input:focus{outline:none;border-color:#185FA5}
button{width:100%;padding:11px;border:none;border-radius:8px;background:#185FA5;color:#fff;
 font-size:14px;font-weight:600;cursor:pointer;margin-top:16px;font-family:inherit}
button:hover{background:#0C447C}
button:disabled{background:#B4B2A9;cursor:wait}
.err{font-size:12px;color:#A32D2D;background:#FCEBEB;padding:9px;border-radius:6px;
 margin-top:12px;display:none;text-align:center}
.note{font-size:10px;color:#B4B2A9;text-align:center;margin-top:14px;line-height:1.5}
</style>
</head>

<script>
var SALT="0tJm/oM4tUyc+yB9cg8xFQ==", IV="+TsOul6IdzpMt6pI", ITER=310000;

function b64(s){var r=atob(s),a=new Uint8Array(r.length);
  for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}

function fallo(m){var e=document.getElementById('e');
  e.textContent=m;e.style.display='block';
  var b=document.getElementById('b');b.disabled=false;b.textContent='Descifrar y abrir';}

async function abrir(){
  var pass=document.getElementById('k').value;
  if(!pass){fallo('Escribe la clave maestra.');return;}
  var b=document.getElementById('b');
  b.disabled=true;b.textContent='Descifrando…';
  document.getElementById('e').style.display='none';
  try{
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    var ct=b64(document.getElementById('payload').textContent.trim());
    var plano=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,ct);

    // El payload va comprimido con gzip
    var ds=new DecompressionStream('gzip');
    var stream=new Blob([plano]).stream().pipeThrough(ds);
    var html=await new Response(stream).text();

    document.open();document.write(html);document.close();
  }catch(err){
    fallo('Clave incorrecta.');
  }
}
</script>
